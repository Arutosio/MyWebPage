<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Arutosio Website</title>
    <link rel="shortcut icon" href="./Files/img/icons/ArutosioIcon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <!-- Prevent theme flash -->
    <script>
        (function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t)})();
    </script>
</head>

<body data-bs-theme="dark" data-theme="dark">
    <video id="videoBG" playsinline="playsinline" autoplay="autoplay" muted="muted" loop="loop"
        class="collapse multi-collapse box show">
        <source id="sorceVideoBG" src="../Files/Videos_webm/Toaru-Kagaku-no-Accelerator.webm" type="video/webm">
        Your browser does not support HTML5 video.
    </video>
    <header>
        <!-- Navbar -->
        <nav id="mainNavbar" class="navbar navbar-expand-lg"></nav>
    </header>
    <div class="d-flex flex-column min-vh-100">
        <main class="flex-grow-1">

            <!-- Section 1 -->
            <section class="jumbotron" id="sHome">
            </section>

            <!-- Section 2 -->
            <section class="jumbotron" id="sAboutMe">
            </section>

            <!-- Section 3 -->
            <section class="jumbotron" id="sFeatures">
            </section>

            <!-- Section 4 -->
            <section class="jumbotron" id="sDonate">
            </section>

            <!-- NotificationCenter -->
            <div id="toastLiveNotificationContainer" class="toast-container position-fixed bottom-0 end-0 p-3">
                <div id="toastLiveNotification" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong id="toastLiveNotificationTitle" class="me-auto">Notification</strong>
                        <small>Just now</small>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div id="toastLiveNotificationMSG" class="toast-body">Hello, world! This is a toast message.</div>
                </div>
            </div>
        </main>
    </div>
    <!-- Footer -->
    <footer id="iFooter" class="sticky-sm-bottom">
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module">
        import { Fancybox } from "https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.esm.js";
    </script>
    <script src="./Js/Main.js" type="module"></script>
</body>

</html>
